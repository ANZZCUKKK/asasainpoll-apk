plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.asasain.poll"
    compileSdk 34
    ndkVersion "25.2.9519653" // NDK versi ini support arm64 + armeabi

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId "com.asasain.poll"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Build libninja.so via CMake
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
                // Build untuk kedua ABI
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
        }

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    // Lokasi CMakeLists.txt untuk build native lib
    externalNativeBuild {
        cmake {
            path "../../NATIVE_LIB/CMakeLists.txt"
            version "3.22.1"
        }
    }

    buildTypes {
        release {
            // Minify + obfuscate untuk bypass anti-cheat berbasis signature
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug

            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                }
            }
        }
        debug {
            minifyEnabled false
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Debug"
                }
            }
        }
    }

    // Pack libninja.so ke dalam APK
    packagingOptions {
        jniLibs {
            useLegacyPackaging true // Agar .so tidak di-compress (bisa di-dlopen)
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
}
